apiVersion: apps/v1                # API group and version used for Deployments
kind: Deployment                   # object type: keeps a set of identical pods running through a ReplicaSet
metadata:                          # identification of the object
  name: nginx-demo                 # Deployment name, used by the script (deployment/nginx-demo)
spec:                              # desired state
  replicas: 3                      # 3 pods must always exist; the ReplicaSet recreates any pod that disappears
  selector:                        # how the Deployment finds its pods
    matchLabels:                   # pods with these labels belong to this Deployment
      app: nginx                   # label app=nginx, must be the same as in the template below
  template:                        # model used to create every pod, including the replacements
    metadata:                      # metadata of each pod
      labels:                      # labels given to each pod
        app: nginx                 # same label as the selector, also used by "kubectl get pods -l app=nginx"
    spec:                          # pod specification
      containers:                  # list of containers inside each pod
        - name: nginx              # one container, called nginx
          image: nginx:alpine      # small Nginx image, fast to download and start
          readinessProbe:          # the pod only counts as ready (1/1) when this check passes
            httpGet:               # the check is an HTTP request
              path: /              # to the main page
              port: 80             # on port 80, where Nginx listens
            periodSeconds: 2       # repeat the check every 2 seconds
